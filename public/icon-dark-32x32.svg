<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark blue background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)"/>
  
  <!-- Circuit board pattern lines -->
  <g stroke="url(#cyanGrad)" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M 4 8 L 12 8 M 16 8 L 24 8 M 28 8 L 28 16 M 28 20 L 28 28"/>
    <path d="M 4 16 L 8 16 M 12 16 L 20 16"/>
    <path d="M 8 4 L 8 12 M 20 20 L 20 28"/>
  </g>
  
  <!-- Glowing dots (circuit nodes) -->
  <circle cx="8" cy="8" r="1" fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="20" cy="8" r="1" fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.6"/>
  <circle cx="28" cy="16" r="1.5" fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.9"/>
  <circle cx="20" cy="24" r="1" fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.7"/>
  
  <!-- "C" letter with tech style -->
  <path d="M 10 16 Q 10 12 12 12 L 12 12" stroke="url(#cyanGrad)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 10 16 Q 10 20 12 20 L 12 20" stroke="url(#cyanGrad)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Sky/cloud element -->
  <path d="M 14 12 Q 15 11 16 12 Q 17 11 18 12" stroke="url(#cyanGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <circle cx="15" cy="12" r="0.8" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="17" cy="12" r="0.8" fill="url(#cyanGrad)" filter="url(#glow)"/>
  
  <!-- Upward arrow (motion/deploy) -->
  <path d="M 22 18 L 22 14 M 20 16 L 22 14 L 24 16" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>

