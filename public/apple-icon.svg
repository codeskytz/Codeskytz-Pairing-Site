<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradLarge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGradLarge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00b8e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    <filter id="glowLarge">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark blue background with rounded corners -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradLarge)"/>
  
  <!-- Subtle glow effect in center -->
  <circle cx="90" cy="90" r="70" fill="url(#glowGrad)" opacity="0.3"/>
  
  <!-- Circuit board pattern -->
  <g stroke="url(#cyanGradLarge)" stroke-width="2" opacity="0.3" fill="none">
    <path d="M 20 30 L 60 30 M 80 30 L 120 30 M 140 30 L 160 30"/>
    <path d="M 30 20 L 30 50 M 50 20 L 50 60 M 70 20 L 70 50"/>
    <path d="M 20 70 L 60 70 M 100 70 L 140 70"/>
    <path d="M 150 50 L 150 90 M 160 50 L 160 100"/>
    <path d="M 30 110 L 70 110 M 100 110 L 140 110"/>
    <path d="M 20 150 L 60 150 M 80 150 L 120 150 M 140 150 L 160 150"/>
    <path d="M 30 130 L 30 160 M 50 130 L 50 160 M 150 130 L 150 160"/>
  </g>
  
  <!-- Glowing circuit nodes -->
  <circle cx="40" cy="30" r="3" fill="url(#cyanGradLarge)" filter="url(#glowLarge)" opacity="0.8"/>
  <circle cx="100" cy="30" r="3" fill="url(#cyanGradLarge)" filter="url(#glowLarge)" opacity="0.6"/>
  <circle cx="150" cy="70" r="4" fill="url(#cyanGradLarge)" filter="url(#glowLarge)" opacity="0.9"/>
  <circle cx="60" cy="110" r="3" fill="url(#cyanGradLarge)" filter="url(#glowLarge)" opacity="0.7"/>
  <circle cx="120" cy="110" r="3" fill="url(#cyanGradLarge)" filter="url(#glowLarge)" opacity="0.7"/>
  <circle cx="40" cy="150" r="3" fill="url(#cyanGradLarge)" filter="url(#glowLarge)" opacity="0.6"/>
  <circle cx="100" cy="150" r="3" fill="url(#cyanGradLarge)" filter="url(#glowLarge)" opacity="0.8"/>
  
  <!-- Main "C" letter (Codesky) -->
  <path d="M 50 90 Q 50 60 75 60 L 75 60" stroke="url(#cyanGradLarge)" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#glowStrong)"/>
  <path d="M 50 90 Q 50 120 75 120 L 75 120" stroke="url(#cyanGradLarge)" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#glowStrong)"/>
  
  <!-- Sky/Cloud elements -->
  <path d="M 85 70 Q 95 60 105 70 Q 115 60 125 70" stroke="url(#cyanGradLarge)" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glowLarge)"/>
  <circle cx="95" cy="70" r="5" fill="url(#cyanGradLarge)" filter="url(#glowLarge)"/>
  <circle cx="115" cy="70" r="5" fill="url(#cyanGradLarge)" filter="url(#glowLarge)"/>
  
  <!-- Additional cloud -->
  <path d="M 90 95 Q 100 85 110 95" stroke="url(#cyanGradLarge)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glowLarge)" opacity="0.8"/>
  <circle cx="100" cy="95" r="4" fill="url(#cyanGradLarge)" filter="url(#glowLarge)" opacity="0.8"/>
  
  <!-- Upward arrow (deploy/motion) -->
  <path d="M 135 100 L 135 75 M 120 87.5 L 135 75 L 150 87.5" stroke="url(#cyanGradLarge)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowStrong)"/>
  
  <!-- "Codesky" text -->
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#cyanGradLarge)" text-anchor="middle" filter="url(#glowLarge)" opacity="0.9">Codesky</text>
</svg>

